  />
  <!-- Eye -->
  <circle cx="326" cy="184" r="9" fill="#081C3A" />
  <circle cx="329" cy="181" r="3" fill="#FFFFFF" />

  <!-- Ocean Waves -->
  <path
    d="M84 318 C144 266, 224 266, 292 312 C348 348, 404 338, 434 304 C406 376, 336 392, 266 356 C202 322, 138 332, 84 374 Z"
    fill="url(#waveGrad)"
  />
  <path
    d="M104 388 C176 346, 250 356, 314 386 C362 408, 402 396, 430 374 C402 422, 342 436, 280 410 C218 384, 158 390, 104 420 Z"
    fill="#38BDF8"
